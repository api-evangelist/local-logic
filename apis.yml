aid: local-logic
name: Local Logic
description: Local Logic is a location intelligence platform for real estate, founded
  in 2015, that turns 100B+ data points across 250 million addresses in the US and
  Canada into 18 proprietary location scores, points of interest, demographics, school
  ratings, market statistics, value drivers, and climate-risk signals. Its REST API
  at api.locallogic.co exposes Location Scores, Profiles, Geographies, Points of Interest,
  Demographics, Schools, Value Drivers, Similar Neighborhoods, Location Snapshot, Market
  Statistics, and Climate Risk endpoints to real estate brokerages, portals, lenders,
  and proptech platforms, authenticated with a client ID and secret.
